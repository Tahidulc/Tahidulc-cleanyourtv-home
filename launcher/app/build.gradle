plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 448
        versionName '4.48'
        // Google's text reader (ChannelSight, the channel's own clock) ships its own native code: the TVs' two.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    lint {
        // Google's text reader (ChannelSight) brings AppCompat along with it; the launcher's own views and screens are
        // plain Android and never use it, so its "use AppCompat's" checks do not apply here.
        disable 'AppCompatCustomView', 'UseAppTint'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The classic kick-off pop-up and line-ups, shared with the phone app: their pages, fonts and sounds
    // (overlays/assets/broadcast) and the code that plays them (overlays/java), with its tests.
    sourceSets {
        main {
            java.srcDirs += ['../../overlays/java']
            assets.srcDirs += ['../../overlays/assets']
        }
        test {
            java.srcDirs += ['../../overlays/javatest']
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // The channel's own scoreboard read off the screen (ChannelSight): Google's text reader, offline, on the TV itself.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // Test only: org.json as on the TV, for the overlays' tests (the SDK's own is a stub on the JVM).
    testImplementation 'org.json:json:20240303'
}
