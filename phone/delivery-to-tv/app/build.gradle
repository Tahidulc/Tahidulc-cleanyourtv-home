plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.deliverytotv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.deliverytotv'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded onto one phone, never published: the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
