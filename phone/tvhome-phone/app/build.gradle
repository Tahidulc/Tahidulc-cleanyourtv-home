plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhomephone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gathin.tvhomephone'
        minSdk 26
        targetSdk 34
        versionCode 137
        versionName '5.06'
        // Phones: the ARM builds of the native parts (the sound decoder, the text reader) only.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded onto the family's own phones, never published: the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2/'
            // Home's look drawn without a phone (HomePreviewTest), only when PREVIEW_OUT names a folder for the pictures.
            systemProperty 'preview.out', System.getenv('PREVIEW_OUT') ?: ''
            maxHeapSize = '2g'
        }
    }

    // The classic kick-off pop-up and line-ups, shared with the TV launcher: their pages, fonts and sounds
    // (overlays/assets/broadcast) and the code that plays them (overlays/java), with its tests.
    sourceSets {
        main {
            java.srcDirs += ['../../../overlays/java']
            // and the matchday intro's real-footage film (24 MB), as on the TV
            assets.srcDirs += ['../../../overlays/assets', '../../../overlays/assets-tv']
        }
        test {
            java.srcDirs += ['../../../overlays/javatest']
            resources.srcDirs += ['../../../overlays/javatest-res']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    // Live TV: the player for the family's own M3U playlist or Xtream Codes login (HLS and MPEG-TS streams).
    implementation 'androidx.media3:media3-exoplayer:1.5.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.0'
    implementation 'androidx.media3:media3-ui:1.5.0'
    // Sound for the channels whose audio the phone can't decode itself: Dolby Digital (AC-3, E-AC-3), MPEG-1 Layer II
    // (MP2) and DTS, as UK channels carry them. Jellyfin's build of Media3's FFmpeg extension (GPL-3.0), used only
    // when the phone has no decoder of its own for the track.
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'
    // Posters, backdrops, crests and stills.
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Reading the channel's own scoreboard (its clock and score) off the picture, on the phone, offline.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    // Tests only: Home drawn off the phone (HomePreviewTest, skipped unless PREVIEW_OUT is set). Not in the app.
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
