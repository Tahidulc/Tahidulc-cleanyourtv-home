<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick-off strap</title>
<style>
  @font-face { font-family: 'Outfit'; src: url('fonts/outfit.ttf') format('truetype'); font-weight: 100 900; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  /* the 1920 x 1080 stage, scaled to fit the screen by strap-host.js; the strap and the board are drawn in it */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: 'Outfit', sans-serif; color: #E6E9F2; }
  .abs { position: absolute; }
  .row { display: flex; align-items: center; }
  .nm { font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
  .lab { font-weight: 700; letter-spacing: .2em; white-space: nowrap; }
  /* the line under the strap (the mock-up's Inter; Outfit here, the bundle's own) */
  .sub { font-family: 'Outfit', sans-serif; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; white-space: nowrap; }
  .crest { object-fit: contain; display: block; flex: none; }
  .coin { border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
  .mark { display: inline-block; vertical-align: middle; flex: none; }
  #board { overflow: hidden; opacity: 0; }
  .bsheen { position: absolute; top: -10%; height: 120%; width: 110px; pointer-events: none; transform: skewX(-20deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.36), rgba(255,255,255,0)); }
  /* a slower TV: no blurs or shadows at all (the strap's in and out are then fades and moves only) */
  html.flat #stage * { filter: none !important; box-shadow: none !important; text-shadow: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="strap" class="abs" style="opacity:0"></div>
  <div id="subline" class="abs"></div>
  <div id="board" class="abs"></div>
</div>
<script src="host.js"></script>
<script src="strap-host.js"></script>
</body>
</html>
