<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line-ups</title>
<style>
  @font-face { font-family: 'Outfit'; src: url('fonts/outfit.ttf') format('truetype'); font-weight: 100 900; }
  @font-face { font-family: 'Barlow Condensed'; src: url('fonts/BarlowCondensed-700.ttf') format('truetype'); font-weight: 100 900; }
  /* the lettering matched to the user's clips: Khand (SIL OFL); its '&' is unusual, so '&' comes from Barlow Condensed */
  @font-face { font-family: 'KhandM'; src: url('fonts/Khand-600.ttf') format('truetype'); font-weight: 600; unicode-range: U+0000-0025, U+0027-FFFF; }
  @font-face { font-family: 'KhandM'; src: url('fonts/Khand-700.ttf') format('truetype'); font-weight: 700; unicode-range: U+0000-0025, U+0027-FFFF; }
  @font-face { font-family: 'KhandM'; src: url('fonts/BarlowCondensed-700.ttf') format('truetype'); font-weight: 100 900; unicode-range: U+0026; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: absolute; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="host.js"></script>
<script src="lineups-host.js"></script>
</body>
</html>
